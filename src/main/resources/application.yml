# ============================================================
# 中文配置（application.yml 以 UTF-8 读取，properties 只能放 ASCII）
# 注：Spring Boot 读取 application.properties 时按 ISO-8859-1 解码，
# 中文写在里面会乱码，因此所有含中文的配置值统一放这里。
# ============================================================

llm:
  # 系统提示词（发给大模型的角色设定）
  system-prompt: 微信AI助手，中文回复，简洁友好，50字内直接回答。
  # 触发图片生成的文本前缀（逗号分隔）
  image-prefixes: /img,/image,画,生成,生成图片,生成一张,帮我生成,帮我画
  # 触发语音回复的文本前缀（逗号分隔）
  voice-prefixes: /语音,/voice

weather:
  # 未识别出城市时的默认城市
  default-city: 北京
