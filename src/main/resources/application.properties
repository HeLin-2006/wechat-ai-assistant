spring.application.name=wechat-ai-assistant
server.port=8080

# ============================================================
# 微信 iLink SDK 配置（wechat.*）
# 说明：扫码登录后登录状态会持久化到 wechat-session.json，
#       服务重启后自动恢复，无需重新扫码。
# ============================================================
# 心跳拉取消息间隔（毫秒），即消息轮询频率
wechat.heartbeat-interval-ms=3000
# 二维码登录超时（毫秒）
wechat.login-timeout-ms=180000
# 登录会话持久化文件
wechat.session-file=wechat-session.json

# ============================================================
# 大模型配置（llm.*，OpenAI 兼容协议）
#
# 申请 API Key：
#   OpenAI   : https://platform.openai.com/api-keys
#   DeepSeek : https://platform.deepseek.com/api_keys （仅文本对话）
#   智谱     : https://open.bigmodel.cn/usercenter/apikeys
#   Moonshot : https://platform.moonshot.cn/console/api-keys
# 也支持任何 OpenAI 兼容的中转/聚合服务。
#
# 推荐直接用环境变量注入，避免把 Key 提交到仓库：
#   export LLM_API_KEY=sk-xxx
#   export LLM_BASE_URL=https://api.openai.com/v1
# ============================================================
llm.api-key=${LLM_API_KEY:}
llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
# 文本/视觉对话模型（OpenAI: gpt-4o-mini；DeepSeek: deepseek-chat；智谱: glm-4.5-flash）
llm.chat-model=${LLM_CHAT_MODEL:gpt-4o-mini}
# 图片生成模型（OpenAI: gpt-image-1 / dall-e-3；智谱: cogview-3-flash）
llm.image-model=${LLM_IMAGE_MODEL:gpt-image-1}
# 语音合成模型（OpenAI: gpt-4o-mini-tts / tts-1）
llm.tts-model=${LLM_TTS_MODEL:gpt-4o-mini-tts}
llm.tts-voice=${LLM_TTS_VOICE:alloy}
llm.chat-temperature=0.7
llm.chat-max-tokens=1024
llm.system-prompt=你是一个运行在微信里的智能 AI 助手。请始终用简体中文、简洁友好地回答问题。用户可能会发送文字、图片或语音：收到图片时请描述图片内容；语音内容已经转为文字。
# 每用户保留的上下文轮数
llm.context-window=10
# 触发图片生成的文本前缀（逗号分隔）
llm.image-prefixes=/img,/image,画,生成图片
# 触发语音回复的文本前缀（逗号分隔）
llm.voice-prefixes=/语音,/voice
# 是否每条回复都额外发送一条语音（需要 ffmpeg + silk_encoder）
llm.voice-reply-enabled=false

# ---- 语音编码（TTS mp3 -> 微信 SILK 语音）----
# ffmpeg 可执行文件路径（macOS: brew install ffmpeg；Linux: apt install ffmpeg）
llm.voice.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
# silk-v3-encoder 编译出的 silk_encoder 路径（见 README「语音回复」一节）
llm.voice.silk-encoder-path=${SILK_ENCODER_PATH:silk_encoder}
# 微信语音采样率
llm.voice.sample-rate=24000
