spring.application.name=wechat-ai-assistant
server.port=8080

# 从本地（不提交）的 application-secret.properties 加载 API Key，见同目录示例
spring.config.import=optional:file:./application-secret.properties[encoding=UTF-8]

# ============================================================
# 微信 iLink SDK 配置（wechat.*）
# ============================================================
# 心跳拉取消息间隔（毫秒），即消息轮询频率
wechat.heartbeat-interval-ms=3000
# 二维码登录超时（毫秒）
wechat.login-timeout-ms=180000
# 登录会话持久化文件
wechat.session-file=wechat-session.json
# 是否忽略机器人自己（扫码绑定账号）发出的消息。iLink 设计上就是绑定账号
# 自己跟机器人对话，默认 false 即可正常聊天；仅当发现回声循环时才设为 true。
wechat.ignore-self=false

# ============================================================
# 文本对话（阿里云百炼 qwen，OpenAI 兼容 compatible-mode）
# Key 在 application-secret.properties 中配置（llm.api-key）
# ============================================================
llm.api-key=${LLM_API_KEY:}
llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.chat-model=qwen3.7-plus
llm.chat-temperature=0.7
llm.chat-max-tokens=1024
llm.system-prompt=微信AI助手，中文回复，简洁友好，50字内直接回答。
llm.context-window=10

# ============================================================
# 图片理解（视觉）：qwen-vl-plus 走 compatible-mode（OpenAI 兼容）
# ============================================================
llm.vision-model=qwen-vl-plus
llm.vision-base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.vision-api-key=${LLM_VISION_API_KEY:}

# ============================================================
# 图片生成：DashScope 万相 wanx 原生异步接口
# ⚠️ base-url 必须是原生地址 https://dashscope.aliyuncs.com/api/v1
# ⚠️ 模型用 wanx2.1-t2i-turbo（qwen-image-3.0 等名字无效，实测报错）
# ============================================================
llm.image-model=wanx2.1-t2i-turbo
llm.image-base-url=https://dashscope.aliyuncs.com/api/v1
llm.image-api-key=${LLM_IMAGE_API_KEY:}
llm.image-size=1024*1024
llm.image-prompt-extend=true
llm.image-timeout-ms=120000
# 触发图片生成的文本前缀（逗号分隔）
llm.image-prefixes=/img,/image

# ============================================================
# 语音合成（TTS）：qwen-tts 走 DashScope 原生 multimodal-generation
# 有效音色示例：Cherry、Serena、Ethan 等（female/male 是占位名，会自动映射）
# ============================================================
llm.tts-model=qwen3-tts-flash
llm.tts-base-url=https://dashscope.aliyuncs.com/api/v1
llm.tts-api-key=${LLM_TTS_API_KEY:${LLM_API_KEY:}}
llm.tts-voice=Cherry
llm.tts-max-chars-per-message=100
# 触发语音回复的文本前缀（逗号分隔）
llm.voice-prefixes=/voice
# 是否每条回复都额外发送一条语音（也可在微信里发「/语音模式」运行时开关）
llm.voice-reply-enabled=false
# ⚠️ 微信官方已调整协议：Bot 通过 sendVoice 发的语音气泡不再渲染（SDK issue #13）。
#    因此默认 false：语音回复改为发送 mp3/wav 音频文件（微信可直接播放）。
#    如未来微信恢复该功能，可设为 true 尝试 SILK 语音气泡。
llm.voice-bubble-enabled=false

# ============================================================
# 语音编码（TTS -> 微信 SILK 语音）
# 本机已安装：ffmpeg（brew）、silk_codec + silk_encoder/silk_decoder（/opt/homebrew/bin）
# ============================================================
llm.voice.ffmpeg-path=/opt/homebrew/bin/ffmpeg
llm.voice.silk-encoder-path=/opt/homebrew/bin/silk_encoder
llm.voice.silk-decoder-path=/opt/homebrew/bin/silk_decoder
llm.voice.sample-rate=24000
