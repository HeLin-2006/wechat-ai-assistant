spring.application.name=wechat-ai-assistant
server.port=8080

# ============================================================
# 微信 iLink SDK 配置（wechat.*）
# 说明：扫码登录后登录状态会持久化到 wechat-session.json，
#       服务重启后自动恢复，无需重新扫码。
# ============================================================
# 心跳拉取消息间隔（毫秒），即消息轮询频率
wechat.heartbeat-interval-ms=3000
# 二维码登录超时（毫秒）
wechat.login-timeout-ms=180000
# 登录会话持久化文件
wechat.session-file=wechat-session.json

# ============================================================
# 大模型配置（llm.*，OpenAI 兼容协议）
#
# ⚠️ 安全提示：API Key 只能通过环境变量注入，切勿直接写在这里并提交仓库！
#    本次部署的 Key 曾误提交到公开仓库，请立即到对应平台重置 Key。
#
# 申请 API Key：
#   OpenAI   : https://platform.openai.com/api-keys
#   DeepSeek : https://platform.deepseek.com/api_keys （仅文本对话）
#   智谱     : https://open.bigmodel.cn/usercenter/apikeys
#   Moonshot : https://platform.moonshot.cn/console/api-keys
# 也支持任何 OpenAI 兼容的中转/聚合服务。
#
# 推荐直接用环境变量注入：
#   export LLM_API_KEY=sk-xxx
#   export LLM_BASE_URL=https://api.deepseek.com
# ============================================================
llm.api-key=${LLM_API_KEY:}
# 文本/视觉对话模型（OpenAI: gpt-4o-mini；DeepSeek: deepseek-chat；智谱: glm-4.5-flash）
llm.base-url=${LLM_BASE_URL:https://api.deepseek.com}
llm.chat-model=${LLM_CHAT_MODEL:deepseek-chat}
llm.chat-temperature=0.7
llm.chat-max-tokens=1024
llm.system-prompt=你是一个运行在微信里的智能 AI 助手。请始终用简体中文、简洁友好地回答问题。用户可能会发送文字、图片或语音：收到图片时请描述图片内容；语音内容已经转为文字。
# 每用户保留的上下文轮数
llm.context-window=10
# 触发图片生成的文本前缀（逗号分隔）
llm.image-prefixes=/img,/image,画,生成图片
# 触发语音回复的文本前缀（逗号分隔）
llm.voice-prefixes=/语音,/voice
# 是否每条回复都额外发送一条语音（需要 ffmpeg + silk_encoder）
llm.voice-reply-enabled=false

# ------------------------------------------------------------
# 图片理解（视觉）：DeepSeek 不支持图片，推荐智谱 GLM-4V-Flash（免费）
#   llm.vision-model=glm-4v-flash
#   llm.vision-base-url=https://open.bigmodel.cn/api/paas/v4
#   llm.vision-api-key=你的智谱Key
# 未配置时回退到 llm.base-url / llm.api-key / llm.chat-model
# ------------------------------------------------------------
llm.vision-model=${LLM_VISION_MODEL:}
llm.vision-base-url=${LLM_VISION_BASE_URL:}
llm.vision-api-key=${LLM_VISION_API_KEY:}

# ------------------------------------------------------------
# 图片生成：DeepSeek 不支持生图，推荐智谱 cogview-3-flash
#   llm.image-model=cogview-3-flash
#   llm.image-base-url=https://open.bigmodel.cn/api/paas/v4
#   llm.image-api-key=你的智谱Key
# ------------------------------------------------------------
llm.image-model=${LLM_IMAGE_MODEL:cogview-3-flash}
llm.image-base-url=${LLM_IMAGE_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
llm.image-api-key=${LLM_IMAGE_API_KEY:}

# ------------------------------------------------------------
# 语音合成（TTS）：DeepSeek 不支持 TTS，推荐智谱 glm-tts（OpenAI 兼容 /audio/speech）
#   llm.tts-model=glm-tts
#   llm.tts-base-url=https://open.bigmodel.cn/api/paas/v4
#   llm.tts-api-key=你的智谱Key
# ------------------------------------------------------------
llm.tts-model=${LLM_TTS_MODEL:glm-tts}
llm.tts-base-url=${LLM_TTS_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
llm.tts-api-key=${LLM_TTS_API_KEY:}
llm.tts-voice=${LLM_TTS_VOICE:female}

# ------------------------------------------------------------
# 语音转文字（ASR）：收到语音且网关未提供转写文本时使用，推荐智谱 glm-asr-2512
#   llm.asr-model=glm-asr-2512
#   llm.asr-base-url=https://open.bigmodel.cn/api/paas/v4
#   llm.asr-api-key=你的智谱Key
# 留空则不做本地 ASR（依赖网关自带转写文本）
# ------------------------------------------------------------
llm.asr-model=${LLM_ASR_MODEL:}
llm.asr-base-url=${LLM_ASR_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
llm.asr-api-key=${LLM_ASR_API_KEY:}

# ---- 语音编码（TTS -> 微信 SILK 语音）----
# ffmpeg 可执行文件路径（macOS: brew install ffmpeg；Linux: apt install ffmpeg）
llm.voice.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
# silk 编码器路径（silk-v3-encoder 的 silk_encoder；本机已装到 /opt/homebrew/bin）
llm.voice.silk-encoder-path=${SILK_ENCODER_PATH:silk_encoder}
# silk 解码器路径（用于把收到的微信语音解码后交给 ASR；本机已装到 /opt/homebrew/bin）
llm.voice.silk-decoder-path=${SILK_DECODER_PATH:silk_decoder}
# 微信语音采样率
llm.voice.sample-rate=24000
# 是否忽略机器人自己（扫码绑定账号）发出的消息。
# iLink 设计上就是绑定账号自己跟机器人对话，默认 false（不忽略）即可正常聊天；
# 仅当发现机器人反复自我回复（回声循环）时才设为 true。
wechat.ignore-self=false
